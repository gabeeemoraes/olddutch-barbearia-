name: Add Old Dutch photos
on:
  push:
    branches: [main]
    paths: ['index.html']
permissions:
  contents: write
jobs:
  photos:
    if: github.event.head_commit.message != 'Add Old Dutch photos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace placeholders with real photos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- OLD-DUTCH-REAL-PHOTOS -->'
          if marker in s:
              raise SystemExit(0)
          code=r'''<style id="old-dutch-real-photos">
          .ph.real-photo{border:0!important;background-size:cover!important;background-position:center!important;min-height:220px}
          .ph.real-photo span{display:none!important}
          </style>
          <script>
          (()=>{
            const imgs=[
              'https://static.wixstatic.com/media/5a0a94_d3d256937e0d41fe966357da0447ed55~mv2_d_2048_1367_s_2.jpg/v1/fill/w_1920%2Ch_1282%2Cal_c%2Cq_90%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/5a0a94_d3d256937e0d41fe966357da0447ed55~mv2_d_2048_1367_s_2.jpg',
              'https://static.wixstatic.com/media/bf6ee2_c91b97cfe8014336becc3c410b302458~mv2.jpg/v1/fill/w_555%2Ch_394%2Cal_c%2Cq_80%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/bf6ee2_c91b97cfe8014336becc3c410b302458~mv2.jpg',
              'https://static.wixstatic.com/media/bf6ee2_712801cbf8d1429885ebede16fea80dc~mv2.png/v1/fill/w_164%2Ch_164%2Cal_c%2Cq_85%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/IMG_8092.png',
              'https://static.wixstatic.com/media/5a0a94_d3d256937e0d41fe966357da0447ed55~mv2_d_2048_1367_s_2.jpg/v1/fill/w_1200%2Ch_800%2Cal_c%2Cq_85/5a0a94_d3d256937e0d41fe966357da0447ed55~mv2_d_2048_1367_s_2.jpg'
            ];
            const apply=()=>document.querySelectorAll('.ph').forEach((el,i)=>{el.classList.add('real-photo');el.style.backgroundImage=`url("${imgs[i%imgs.length]}")`;});
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',apply); else apply();
          })();
          </script>
          <!-- OLD-DUTCH-REAL-PHOTOS -->'''
          s=s.replace('</body>',code+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add Old Dutch photos" || exit 0
          git push